
name: Build Earthsplitter Mod

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Extract project
        run: |
          mkdir source
          unzip -q *.zip -d source
          PROJECT=$(find source -name build.gradle -printf '%h\n' | head -n 1)
          echo "PROJECT=$PROJECT" >> $GITHUB_ENV

      - name: Build mod
        run: gradle -p "$PROJECT" build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Earthsplitter-Minecraft-JAR
          path: source/**/build/libs/*.jar
